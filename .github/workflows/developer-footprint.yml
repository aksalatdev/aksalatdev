name: Developer footprint

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developer-footprint
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate developer footprint
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aksalatdev
          filename: assets/developer-footprint.svg
          committer_message: Update developer footprint
          template: classic
          base: ""
          config_display: large
          config_timezone: Asia/Jakarta
          config_animations: no
          config_order: languages, notable
          config_output: svg
          optimize: css, xml
          plugins_errors_fatal: yes

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_languages_categories: programming, markup
          plugin_languages_recent_categories: programming, markup
          plugin_languages_recent_load: 500
          plugin_languages_recent_days: 30

          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_filter: "stars:>100"
          plugin_notable_repositories: yes
          plugin_notable_types: pull_request
