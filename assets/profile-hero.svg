<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Aksal Abitahta — Full-stack developer</title>
  <desc id="desc">A software release manifest introducing Aksal Abitahta and highlighting an upstream open-source contribution.</desc>

  <rect width="1200" height="520" fill="#F2EFE7"/>

  <!-- Manifest grid -->
  <g fill="none" stroke="#161616" stroke-width="1" opacity="0.22">
    <path d="M88 0V520M136 0V520M420 0V440M730 0V440M1010 0V440"/>
    <path d="M88 54H1200M88 112H1200M88 390H1200M0 440H1200"/>
  </g>

  <!-- Routing rail -->
  <rect width="88" height="440" fill="#1647D8"/>
  <text x="-416" y="56" transform="rotate(-90)" fill="#F2EFE7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4.5">TAHTA LABS / BUILD / DEBUG / SHIP</text>
  <circle cx="44" cy="28" r="9" fill="#FF5A1F"/>

  <!-- Registration data -->
  <g fill="#161616" font-family="Arial, Helvetica, sans-serif">
    <text x="158" y="34" font-size="13" font-weight="700" letter-spacing="2.4">RELEASE MANIFEST  /  001</text>
    <text x="750" y="34" font-size="13" font-weight="700" letter-spacing="2.4">MALANG  /  INDONESIA</text>
    <text x="1033" y="34" font-size="13" font-weight="700" letter-spacing="2.4">STATUS  /  LIVE</text>
  </g>

  <!-- Identity -->
  <g fill="#161616" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-5">
    <text x="148" y="238" font-size="142">AKSAL</text>
    <text x="148" y="365" font-size="142">ABITAHTA</text>
  </g>

  <rect x="870" y="112" width="330" height="162" fill="#161616"/>
  <circle cx="1043" cy="194" r="61" fill="#FF5A1F"/>
  <path d="M982 194H1104M1043 133V255" stroke="#161616" stroke-width="2"/>
  <g fill="#F2EFE7" font-family="Arial, Helvetica, sans-serif">
    <text x="892" y="139" font-size="12" font-weight="700" letter-spacing="2.2">PRODUCT-MINDED</text>
    <text x="892" y="158" font-size="12" font-weight="700" letter-spacing="2.2">FULL-STACK DEVELOPER</text>
  </g>

  <!-- Proof stamp: the deliberate grid break -->
  <g transform="rotate(-3 888 355)">
    <rect x="674" y="303" width="458" height="104" fill="#FF5A1F"/>
    <text x="700" y="346" fill="#161616" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="35" font-weight="900" letter-spacing="0.5">SHIPPED UPSTREAM</text>
    <text x="702" y="379" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">LEARNHARNESS  /  V0.3.9  /  CO-AUTHORED</text>
  </g>

  <!-- Footer strip -->
  <rect y="440" width="1200" height="80" fill="#161616"/>
  <g fill="#F2EFE7" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">
    <text x="38" y="487">BUILD</text>
    <text x="222" y="487">MOBILE</text>
    <text x="432" y="487">BACKEND</text>
    <text x="655" y="487">AUTOMATION</text>
    <text x="930" y="487">AI TOOLING</text>
  </g>
  <g fill="#FF5A1F">
    <circle cx="176" cy="482" r="5"/>
    <circle cx="386" cy="482" r="5"/>
    <circle cx="609" cy="482" r="5"/>
    <circle cx="884" cy="482" r="5"/>
    <rect x="1128" y="474" width="34" height="16"/>
  </g>

  <!-- Crop and registration marks -->
  <g stroke="#161616" stroke-width="2">
    <path d="M108 76h18M117 67v18M1150 76h18M1159 67v18"/>
    <path d="M108 416h18M117 407v18M1150 416h18M1159 407v18"/>
  </g>
