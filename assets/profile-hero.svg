<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Aksal Abitahta, full-stack developer</title>
  <desc id="desc">A technical profile for Aksal Abitahta, a full-stack developer in Indonesia.</desc>

  <style>
    .identity {
      animation: rise 560ms cubic-bezier(0.23, 1, 0.32, 1) both;
    }
    .metrics {
      animation: enter-right 520ms cubic-bezier(0.23, 1, 0.32, 1) 90ms both;
    }
    .footer-strip {
      animation: fade 360ms ease 180ms both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes enter-right {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .identity, .metrics, .footer-strip { animation: none; }
    }
  </style>

  <rect width="1200" height="520" fill="#F2EFE7"/>

  <!-- Manifest grid -->
  <g fill="none" stroke="#161616" stroke-width="1" opacity="0.22">
    <path d="M88 0V520M136 0V520M420 0V440M730 0V440M1010 0V440"/>
    <path d="M88 54H1200M88 112H1200M88 390H1200M0 440H1200"/>
  </g>

  <!-- Routing rail -->
  <rect width="88" height="440" fill="#1647D8"/>
  <text x="-416" y="56" transform="rotate(-90)" fill="#F2EFE7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4.5">TAHTA LABS / BUILD / DEBUG / SHIP</text>
  <circle cx="44" cy="28" r="9" fill="#FF5A1F"/>

  <!-- Registration data -->
  <g fill="#161616" font-family="Arial, Helvetica, sans-serif">
    <text x="158" y="34" font-size="13" font-weight="700" letter-spacing="2.4">FULL-STACK DEVELOPER  /  001</text>
    <text x="822" y="34" font-size="13" font-weight="700" letter-spacing="2.4">INDONESIA</text>
    <text x="1033" y="34" font-size="13" font-weight="700" letter-spacing="2.4">PROFILE  /  GITHUB</text>
  </g>

  <!-- Identity -->
  <g class="identity" fill="#161616" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-4.5">
    <text x="148" y="232" font-size="124">AKSAL</text>
    <text x="148" y="350" font-size="124">ABITAHTA</text>
  </g>

  <!-- Verified GitHub activity, 28 Oct 2025 to 28 Oct 2026 -->
  <g class="metrics">
    <rect x="850" y="112" width="350" height="278" fill="#161616"/>
    <text x="880" y="201" fill="#FF5A1F" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="74" font-weight="900">660</text>
    <text x="882" y="232" fill="#F2EFE7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CONTRIBUTIONS / 12 MONTHS</text>
    <path d="M880 264H1170" stroke="#F2EFE7" stroke-width="1" opacity="0.35"/>
    <text x="880" y="338" fill="#F2EFE7" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="64" font-weight="900">14</text>
    <text x="975" y="337" fill="#F2EFE7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">PULL REQUESTS</text>
    <text x="882" y="370" fill="#F2EFE7" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" opacity="0.7">GITHUB / OCT 2025 TO OCT 2026</text>
  </g>

  <!-- Footer strip -->
  <g class="footer-strip">
    <rect y="440" width="1200" height="80" fill="#161616"/>
    <g fill="#F2EFE7" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">
      <text x="38" y="487">BUILD</text>
      <text x="222" y="487">MOBILE</text>
      <text x="432" y="487">BACKEND</text>
      <text x="655" y="487">AUTOMATION</text>
      <text x="930" y="487">AI TOOLING</text>
    </g>
    <g fill="#FF5A1F">
      <circle cx="176" cy="482" r="5"/>
      <circle cx="386" cy="482" r="5"/>
      <circle cx="609" cy="482" r="5"/>
      <circle cx="884" cy="482" r="5"/>
      <rect x="1128" y="474" width="34" height="16"/>
    </g>
  </g>

  <!-- Crop and registration marks -->
  <g stroke="#161616" stroke-width="2">
    <path d="M108 76h18M117 67v18M1150 76h18M1159 67v18"/>
    <path d="M108 416h18M117 407v18M1150 416h18M1159 407v18"/>
  </g>
</svg>
